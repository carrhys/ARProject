<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plantain Leaf Overlay Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 20%, #23472b, #071109 65%);
      color: white; padding: 24px;
    }
    main { width: min(92vw, 480px); text-align: center; }
    .stage {
      position: relative; aspect-ratio: 600 / 994; overflow: hidden;
      border-radius: 28px; background: white;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #overlay { opacity: 0; transform: scale(.9); transform-origin: center; }
    #overlay.play { animation: reveal 1.35s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes reveal {
      0% { opacity: 0; transform: scale(.9) translateY(-2%); }
      55% { opacity: 1; }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    h1 { font-size: clamp(25px, 6vw, 38px); margin: 0 0 8px; }
    p { color: #c6d3c8; line-height: 1.5; }
    button, a {
      display: inline-flex; justify-content: center; align-items: center;
      min-height: 48px; border-radius: 999px; padding: 0 22px;
      font: inherit; font-weight: 700; text-decoration: none;
    }
    button { border: 0; cursor: pointer; background: #f4c95d; color: #152016; }
    a { color: white; border: 1px solid rgba(255,255,255,.25); margin-left: 8px; }
    .actions { margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Overlay alignment preview</h1>
    <p>This simulates the photographic food layer appearing over the printed empty leaf.</p>
    <div class="stage">
      <img src="./assets/target-empty-leaf.png" alt="Empty plantain leaf" />
      <img id="overlay" src="./assets/food-overlay.png" alt="Food reveal overlay" />
    </div>
    <div class="actions">
      <button id="replay" type="button">Replay reveal</button>
      <a href="./index.html">Open AR</a>
    </div>
  </main>
  <script>
    const overlay = document.querySelector('#overlay');
    const replay = () => {
      overlay.classList.remove('play');
      void overlay.offsetWidth;
      overlay.classList.add('play');
    };
    document.querySelector('#replay').addEventListener('click', replay);
    window.addEventListener('load', replay);
  </script>
</body>
</html>
